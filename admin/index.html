<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול המערכת</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../manage/manage.css">
<style>
  :root { --brand: #3d5a80; --on-brand: #fff; --brand-text-l: #2f4a6b; --brand-text-d: #a9c3e6; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .filters .btn[aria-pressed=true] { background: var(--hero); color: var(--on-hero); box-shadow: none; }
  .due { color: var(--bad); font-weight: 700; }
  .item .main .line { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
  .item .main .line.due { color: var(--bad); }
  .filters { flex-wrap: nowrap; }
</style>
</head>
<body>
<a class="skip" href="#app">דילוג לתוכן</a>
<main id="app"><div class="empty" role="status">טוען…</div></main>
<nav class="tabs" id="tabs" aria-label="ניווט ראשי" hidden></nav>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-t">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../shared/biz.js"></script>
<script src="../shared/motion.js"></script>
<script src="../shared/sheet.js"></script>
<script src="../shared/router.js"></script>
<script src="../shared/themes.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/ui.js"></script>

<script src="../admin/office.js"></script>

</html>
